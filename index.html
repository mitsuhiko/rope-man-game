<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Rope Dash Spike</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #fffdf7;
      --muted: #7b7b7b;
      --rope: #8b5a2b;
      --spike: #d82424;
      --lava: #ff6a21;
      --water: #2f9bff;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive;
    }

    body {
      box-sizing: border-box;
    }

    .game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--paper);
      touch-action: manipulation;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
      cursor: crosshair;
      touch-action: manipulation;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 0 0 auto auto;
      box-sizing: border-box;
      width: clamp(132px, 16vw, 220px);
      padding: clamp(7px, 1vw, 13px) clamp(9px, 1.2vw, 16px);
      border: solid var(--ink);
      border-width: 0 0 3px 3px;
      background: rgba(255, 253, 247, 0.94);
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .score-label {
      font-size: clamp(22px, 2.35vw, 38px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.08em;
      text-transform: uppercase;
    }

    .score-value {
      margin-top: 6px;
      font-size: clamp(16px, 1.6vw, 24px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .score-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: clamp(9px, 0.95vw, 13px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .touch-controls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 3;
    }

    .touch-action,
    .touch-joystick {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(18px, 4vw, 34px));
      width: clamp(112px, 26vw, 168px);
      height: clamp(112px, 26vw, 168px);
      box-sizing: border-box;
      border: 3px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      background: rgba(255, 253, 247, 0.04);
      color: rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      touch-action: manipulation;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-action {
      right: calc(env(safe-area-inset-right, 0px) + clamp(18px, 4vw, 34px));
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
    }

    .touch-action::before {
      content: "";
      position: absolute;
      inset: 23%;
      border: 2px dashed rgba(0, 0, 0, 0.42);
      border-radius: 50%;
    }

    .touch-action::after {
      content: "HOOK";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(13px, 3.2vw, 20px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .touch-action:active {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.62);
    }

    .touch-joystick {
      left: calc(env(safe-area-inset-left, 0px) + clamp(18px, 4vw, 34px));
    }

    .touch-joystick::before,
    .touch-joystick::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .touch-joystick::before {
      left: 18%;
      right: 18%;
      top: 50%;
      border-top: 2px solid rgba(0, 0, 0, 0.28);
      transform: translateY(-50%);
    }

    .touch-joystick::after {
      top: 18%;
      bottom: 18%;
      left: 50%;
      border-left: 2px solid rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
    }

    .touch-joystick-deadzone {
      position: absolute;
      inset: 34%;
      border: 2px solid rgba(0, 0, 0, 0.34);
      border-radius: 50%;
      pointer-events: none;
    }

    .touch-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 35%;
      height: 35%;
      box-sizing: border-box;
      border: 3px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      background: rgba(255, 253, 247, 0.04);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out;
    }

    .touch-joystick.is-active .touch-stick {
      border-color: rgba(0, 0, 0, 0.65);
      transition: none;
    }

    @media (pointer: coarse), (hover: none) {
      .touch-controls {
        display: block;
      }
    }

    @media (max-width: 700px), (max-height: 480px) {
      .hud {
        width: 112px;
        padding: 6px 7px;
      }
      .score-label { font-size: 19px; }
      .score-value {
        margin-top: 4px;
        font-size: 14px;
      }
      .score-meta {
        margin-top: 3px;
        font-size: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Rope Dash Spike">
    <canvas id="game" aria-label="Rope Dash canvas game"></canvas>
    <section class="hud" aria-label="Score">
      <div class="score-label">score</div>
      <div class="score-value"><span id="score">0</span>m</div>
      <div class="score-meta">best <span id="best">0</span>m · <span id="state">attached</span></div>
    </section>
    <div class="touch-controls" aria-label="Touch controls">
      <button id="touch-action" class="touch-action" type="button" aria-label="Hook or unhook"></button>
      <div id="touch-joystick" class="touch-joystick" aria-label="Move and reel joystick">
        <div class="touch-joystick-deadzone"></div>
        <div id="touch-stick" class="touch-stick"></div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
